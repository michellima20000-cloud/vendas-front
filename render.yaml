services:
  - type: web
    name: vendas-front
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- -p $PORT
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Cole aqui a URL da API, ex.: https://vendas-black.onrender.com/api/v1
      - key: NEXT_PUBLIC_API_URL
        sync: false
      # Upstash Redis (usado somente no servidor: cache do catálogo público).
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
